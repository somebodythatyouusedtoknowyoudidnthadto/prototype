<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        @font-face {
        font-family: 'Juache';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMJUA.woff') format('woff');
        font-weight: normal;
        font-display: swap;
}
        body{
            background-color: black;
            color: mediumaquamarine ;
            font-family:"Juache";
        }

        h1{
            /*색상 설정*/
            color: pink;
            margin-bottom:5px;


        }

        p{
            color:lightblue
        }

        .warp{
            /*너비*/
            width:60%;
            /*상하/좌우*/
            margin:20px auto 0;
            /*배경색+투명도*/
            background-color:rgba(255, 255,255,0.1);
            /*모서리 곡률*/
            border-radius:10px;
            /*테두리 안쪽 여백*/
            padding:20px;
            /*상하/좌우*/
            /*margin: auto0; */
        }
        img {
            width:100%;
            border-radius: 50px;
        }
        .todo_warp{
            background-color: rgb(0, 78, 52);
            margin-top: 15px;
            padding:15px;
            border-radius: 5px;
        }
        h2{
            color:skyblue

        }
        .todo_warp h2,
        .todo_check_warp h2{
            margin-top:0px;
        }
        .todo_check_warp{
            background-color: rgba(0, 255, 204, 0.2);
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
        }
        button{
            background-color: darkturquoise;
            border:none;
            color:white   ;
            padding:5px 10px;
            cursor: pointer;
            border-radius: 5px;

        }
        button:hover{
            background-color: darkturquoise;
            color:aqua;
        }
        input{
            padding:5px;
        }
        #todo_list li{
            margin-bottom:5px;
        }
        #todo_list .todo_item.done{
            color: pink;
        }
    </style>
</head>
<body>
    <div class="warp">
        <h1>todolist</h1>
        <p>해야할 일을 관리하는 곳입니다.</p>
        <!-- ./ -> ,  -->
        <!--이미지-->
        <!--목록-->
        <img src="./yippie.jpg" alt="투두리스트"/>
        <div class="todo_warp">
            <h2>할 일 목록</h2>
            <ol id="todo_list">

            </ol>
        </div>
        <!--등록-->
        <div class="todo_warp">
            <h2>할 일 등록</h2>
            <input 
                id="input_todo"
                type="text"
                placeholder="할 일을 입력하세요."/>

            <button id="btn_add">등록</button>
        </div>
        <!--완료 처리-->
        <div class="todo_check_warp">
            <h2>완료하기</h2>
            <p>
                완료 처리할 아이템의 순번을 입력하고 버튼을 누르면 완료
                처리됩니다.
            </p>
            <input 
                id="input_todo_num"
                type="number"
                placeholder="할 일을 입력하세요."/>
                <button id="btn_check">완료</button>
        </div>

    </div>
    </body>
    <script>
        const todos=["밥 먹기","씻기","양치하기"];
        //기본 할 일 렌더링
        function renderTodo(todo){
            const li = document.createElement("li")
            li.textContent= todo;
            li.classList.add("todo_item")
            document.getElementById("todo_list").appendChild(li);
        }
        
        
        for(let i=0; i<todos.length;i++){
            renderTodo(todos[i]);
            
        }
        document.getElementById("btn_add").onclick=function addtodo(){
            //1.입력된 내용을 가져온다
            const todo = document.getElementById("input_todo").value;
            //2.해당 내용을 todos에 추가한다.
            todos.push(todo);
            //3.렌더링한다.
            renderTodo(todo);
        };

        //완료 버튼이 눌렸을떄
        document.getElementById("btn_check").onclick = function() {
            const num = document.getElementById("input_todo_num").value;

            if(num < 1 || num > todos.length){
                //n-1번쨰의 li태그에 완료 클래스를 추가해삔다.
                alert(`1부터${todos}사이의 값을 입력해 주세요`);
                return;

            }
            const todoItems=document.getElementsByClassName("todo_item");
            todoItems[num-1].classList.add("done"); 
        
                    
                
            
            
        };
        // 입력한 숫자가 무었인지 가져온다
        //n이 1~ todos 배열의 길이 사이의 값인지 확인
        //n 값이 유효하다면, ㅜ-1번쨰의  태그에 완료 클래스를 추가한다.
        //n 값이 유효하지 않다면 ,alert
        //기본 할일 렌더링
        
        //할일등록
        //완료
    </script>
</html>
