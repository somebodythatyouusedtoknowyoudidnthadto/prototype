<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <body>
        <h2>성적 확인</h2>
        <input 
            id="input_num"
            type="number"
            placeholder="점수를 입력하세요 "/>
        <button id="btn" type="button">확인하기</button>
        <div id="result"></div>
        </html>
        <script>
            document.getElementById("btn").onclick= function(){
            
                const score= document.getElementById("input_num").value;
                result=null
                if (100<score || score < 0 ) {
                    result="유효하지 않은 값"
                } else {
                    switch(Math.trunc(score/10)){
                        case 10:
                        case 9:
                            result = "A"
                            break;
                        case 8:
                            result="B"
                            break;
                        case 7:
                            result="C"
                            break;
                        case 6:
                            result="D"                        
                            break;
                        default:
                            result="F"
                            break;
                    }
                }
            alert(result);
            document.getElementById("result").textContent=result;
        
        
        
        };
        
        </script>
    </body>
</head>
